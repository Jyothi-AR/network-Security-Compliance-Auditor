version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption

hostname CORE-SECURE-01

boot-start-marker
boot-end-marker

aaa new-model
aaa authentication login default group radius local

ip domain name corp.example.local
ip name-server 10.10.10.10
ip name-server 10.10.10.11

ip ssh version 2
no ip http server
no ip http secure-server

login block-for 900 attempts 3 within 120

logging buffered 65536
logging trap informational
logging host 10.10.40.50

snmp-server location DATA-CENTER-SECURE
snmp-server contact secops@example.local

ntp server 10.10.40.20
ntp server 10.10.40.21

banner motd ^C
=====================================================
WARNING: PROPRIETARY & RESTRICTED INFRASTRUCTURE
UNAUTHORIZED ACCESS PROHIBITED UNDER LAW.
=====================================================
^C

line console 0
 exec-timeout 10 0
 logging synchronous

line vty 0 4
 transport input ssh
 exec-timeout 10 0
 login authentication default

line vty 5 15
 transport input ssh
 exec-timeout 10 0
 login authentication default

end
