set deviceconfig system hostname PA-NGFW-PERIMETER
set deviceconfig system ip-address 192.168.1.1 netmask 255.255.255.0
set deviceconfig system default-gateway 192.168.1.254
set deviceconfig system dns-setting servers primary 1.1.1.1
set deviceconfig system timezone UTC

set deviceconfig system service disable-http yes
set deviceconfig system service disable-telnet yes
set deviceconfig system service disable-ssh no

set shared log-settings syslog SYSLOG-SERVER server 10.10.40.50
set shared log-settings syslog SYSLOG-SERVER facility LOG_USER
set shared log-settings syslog SYSLOG-SERVER port 514

set zone TRUST network layer3 ethernet1/2
set zone UNTRUST network layer3 ethernet1/1
